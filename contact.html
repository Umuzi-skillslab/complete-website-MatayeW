<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Personal portfolio showcasing web development projects, skills, and contact information."
    />
    <title>Contact | My Portfolio</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <a href="#main-content" class="skip-link"> Skip to main content </a>

    <header>
      <h1>Contact</h1>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="projects.html">Projects</a></li>
          <li>
            <a href="contact.html" class="active" aria-current="page"
              >Contact</a
            >
          </li>
        </ul>
      </nav>
    </header>

    <main id="main-content">
      <section>
        <h2>Get In Touch</h2>

        <form action="#" method="post">
          <label for="name">Name:</label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="John Doe"
            required
            minlength="2"
            maxlength="50"
          />

          <label for="email">Email:</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="yourname@example.com"
            required
          />

          <label for="subject">Subject:</label>
          <select id="subject" name="subject" required>
            <option value="">Select...</option>
            <option value="general">General Enquiry</option>
            <option value="project">Project Discussion</option>
            <option value="other">Other</option>
          </select>

          <fieldset>
            <legend>Preferred Contact Method:</legend>

            <input
              type="radio"
              id="contact-email"
              name="contact_method"
              value="email"
              required
            />
            <label for="contact-email">Email</label>

            <input
              type="radio"
              id="contact-phone"
              name="contact_method"
              value="phone"
            />
            <label for="contact-phone">Phone</label>
          </fieldset>

          <label>
            <input
              type="checkbox"
              id="subscribe"
              name="subscribe"
              value="yes"
            />
            Subscribe to newsletter
          </label>

          <label for="message">Message:</label>
          <textarea
            id="message"
            name="message"
            required
            minlength="10"
            maxlength="500"
          ></textarea>

          <div aria-live="polite"></div>

          <button type="submit">Send</button>
        </form>
      </section>
    </main>

    <footer>
      <p>Contact: <a href="mailto:email@example.com">email@example.com</a></p>
    </footer>
  </body>
</html>
